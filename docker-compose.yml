services:
  streamlit:
    build: .
    ports:
      - "8501:8501"
    environment:
      MODEL_PATH: /app/models/best_model.joblib
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/best_model.joblib
    restart: unless-stopped
